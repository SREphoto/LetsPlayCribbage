<div class="flex-shrink-0 flex justify-between items-center p-4 border-b border-gray-700">
  <h2 class="text-2xl font-bold text-yellow-300">{{ contentData().title }}</h2>
  <button (click)="closeModal.emit()" class="p-2 rounded-full hover:bg-gray-700 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>

<div class="flex-grow overflow-y-auto p-6 min-h-0">
  <!-- Content -->
  <div class="prose prose-invert max-w-none text-gray-300 break-words">
    @for (line of contentData().formattedContent; track $index) {
      @switch (line.type) {
        @case ('h2') {
          <h2 class="text-2xl font-bold text-yellow-300 border-b-2 border-yellow-300/30 pb-2 mb-4 mt-6">{{ line.text }}</h2>
        }
        @case ('h3') {
          <h3 class="text-xl font-bold text-white mt-5 mb-3">{{ line.text }}</h3>
        }
        @case ('p') {
          <p class="leading-relaxed mb-3" [innerHTML]="line.text"></p>
        }
      }
    }
  </div>
</div>
